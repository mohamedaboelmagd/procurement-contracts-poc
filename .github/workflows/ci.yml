name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.mongodb-binaries
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Cache MongoDB binaries (mongodb-memory-server)
        uses: actions/cache@v4
        with:
          path: .mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}
      - name: Install
        run: npm ci --prefix backend && npm ci --prefix frontend
      - name: Typecheck
        run: npm run typecheck --prefix backend && npm run typecheck --prefix frontend
      - name: Unit tests (domain, services, auth)
        run: npm run test:unit --prefix backend
      - name: API tests (supertest + MongoDB replica set via mongodb-memory-server)
        run: npm run test:api --prefix backend
      - name: React component tests
        run: npm test --prefix frontend
      - name: Build API
        run: npm run build --prefix backend
      - name: Build demo
        run: npm run build --prefix frontend

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t procurement-contracts-api:ci backend
